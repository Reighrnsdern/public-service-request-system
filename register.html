{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}
<div class="auth-card mx-auto"><h2 class="fw-bold">Create your account</h2><p class="text-muted">Register to submit and track requests.</p>
<form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
<label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password (at least 8 characters)</label><input class="form-control mb-4" type="password" name="password" minlength="8" required>
<button class="btn btn-primary w-100">Create account</button></form><p class="mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
