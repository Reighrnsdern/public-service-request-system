{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block content %}
<div class="auth-card mx-auto"><h2 class="fw-bold">Welcome back</h2><p class="text-muted">Sign in to manage your service requests.</p>
<form method="post"><label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required>
<button class="btn btn-primary w-100">Sign in</button></form><p class="mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
<div class="small text-muted mt-3">Demo admin: admin@example.com / Admin123!</div></div>{% endblock %}
